<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Logo icon -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M24 28 C24 22, 30 18, 40 18 C50 18, 56 22, 56 28 C56 34, 50 38, 40 44 L24 60 L56 60"
          stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="56" cy="60" r="3" fill="#A855F7"/>
  </g>
  <!-- Product name -->
  <text x="180" y="272" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">
    MySQL<tspan fill="url(#accent)">2</tspan>PG
  </text>
  <!-- Tagline -->
  <text x="180" y="310" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#a1a1aa">
    High-Performance MySQL to PostgreSQL Migration
  </text>
  <!-- Feature badges -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="160" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="80" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle">DDL + Data</text>

    <rect x="180" y="0" width="160" height="40" rx="8" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <text x="260" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#06B6D4" text-anchor="middle">100% Accuracy</text>

    <rect x="360" y="0" width="160" height="40" rx="8" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="440" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#8B5CF6" text-anchor="middle">Open Source</text>

    <rect x="540" y="0" width="160" height="40" rx="8" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="620" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#22c55e" text-anchor="middle">Go Powered</text>
  </g>
  <!-- Bottom accent line -->
  <rect x="80" y="560" width="200" height="3" rx="1.5" fill="url(#amber)"/>
  <!-- URL -->
  <text x="80" y="595" font-family="JetBrains Mono, monospace" font-size="16" fill="#71717a">github.com/xfg0218/MySQL2PG</text>
</svg>
